services:
  app:
    build: .
    ports:
      - "3000:3000"
    environment:
      - LLM_PROVIDER=mock
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - APIFY_TOKEN=${APIFY_TOKEN:-}
      - DATA_DIR=/data
      - CONCURRENCY=12
      - ROUND2_TOP_K=6
    volumes:
      - app_data:/data
    restart: unless-stopped

volumes:
  app_data:
